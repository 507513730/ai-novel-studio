name: Deploy Site

# P25：停用自动触发——GitHub Pages 未启用（configure-pages 权限不足，3 连败）。
# 介绍站建设时：1) 仓库 Settings → Pages → Source: GitHub Actions 手动启用
#                 2) 本文件恢复 push 触发（移除下方 if: false）
# 手动触发也不执行（占位站无部署意义）。

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "site/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
