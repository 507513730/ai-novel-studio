name: Build Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  # P20（T1）：PR 质量门禁（typecheck + lint + test，不打包）
  pull_request:

permissions:
  contents: write

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  build-windows:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 版本规范化（P21 追加）：tag 必须与 package.json 版本一致（防"0.2.x 打 v0.3.0"类错误发布）
      - name: Verify tag matches package.json
        run: node -e "
          const p = require('./package.json');
          const tag = process.env.GITHUB_REF_NAME ?? '';
          if (!tag.startsWith('v')) throw new Error('tag must start with v');
          if (tag.slice(1) !== p.version) throw new Error('tag ' + tag + ' != package.json version ' + p.version);
          console.log('OK: tag ' + tag + ' matches package.json ' + p.version);
        "

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build + Package
        run: pnpm dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.blockmap
          generate_release_notes: true
