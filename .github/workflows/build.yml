name: Build Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  # P20（T1）：PR 质量门禁（typecheck + lint + test，不打包）
  pull_request:

permissions:
  contents: write

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # P26：依赖安全（高危漏洞阻断）
      - name: Audit dependencies
        run: pnpm audit --prod --audit-level=high || (echo "::error::存在高危依赖漏洞，请升级或评估"; exit 1)

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  # v0.25.0（审查 L5）：此前仅产出 Windows 安装包，macOS / Linux 用户无法安装。
  # 改为三平台矩阵；fail-fast: false 保证单平台构建失败不影响其他平台产物。
  build:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist: dist:win
            artifact: installers-windows
            path: |
              release/*.exe
              release/*.blockmap
              release/*.yml
          - os: macos-latest
            dist: dist:mac
            artifact: installers-macos
            path: |
              release/*.dmg
              release/*.blockmap
              release/*.yml
          - os: ubuntu-latest
            dist: dist:linux
            artifact: installers-linux
            path: |
              release/*.AppImage
              release/*.yml
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 版本规范化（P21 追加）：tag 必须与 package.json 版本一致（防"0.2.x 打 v0.3.0"类错误发布）
      - name: Verify tag matches package.json
        run: node scripts/verify-tag.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build + Package (${{ matrix.os }})
        run: pnpm run ${{ matrix.dist }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # v0.25.0（审查 L5）：三平台产物统一发布
          files: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.blockmap
            release/*.yml
          generate_release_notes: true
