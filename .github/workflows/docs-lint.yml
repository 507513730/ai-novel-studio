name: Docs Lint

# v0.24.3（文档治理）：markdown 健康检查（乱码拦截 + 相对断链拦截）
# 触发：PR 与 main push（仅 md / 检查脚本变更时，避免空跑）

on:
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/check-docs.mjs"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "scripts/check-docs.mjs"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Docs health check
        run: node scripts/check-docs.mjs
