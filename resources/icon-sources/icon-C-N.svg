<svg width="1024" height="1024" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- P16 稿C：首字母 N 负形——竖笔=笔杆、斜笔=书脊，白+一点紫 -->
  <defs>
    <linearGradient id="bgC" x1="14" y1="12" x2="82" y2="84" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14121e" />
      <stop offset="1" stop-color="#0a0910" />
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="80" height="80" rx="22" fill="url(#bgC)" />
  <!-- N：竖笔（笔杆） -->
  <rect x="30" y="24" width="8" height="48" rx="4" fill="#F2F4F8" />
  <!-- N：斜笔（翻开的书脊） -->
  <path d="M38 24 L58 72 L50 72 L30 24 Z" fill="#F2F4F8" />
  <!-- 右侧竖笔（N 的右腿） -->
  <rect x="58" y="24" width="8" height="48" rx="4" fill="#F2F4F8" />
  <!-- 一点紫（书脊交点） -->
  <circle cx="50" cy="72" r="3.5" fill="#7B6CFF" />
</svg>
