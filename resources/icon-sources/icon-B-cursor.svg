<svg width="1024" height="1024" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- P16 稿B：书页+光标——深底两片书页倒V，右页发光AI光标（蓝紫渐变只给光标） -->
  <defs>
    <linearGradient id="bgB" x1="14" y1="12" x2="82" y2="84" gradientUnits="userSpaceOnUse">
      <stop stop-color="#151a24" />
      <stop offset="1" stop-color="#0b0d12" />
    </linearGradient>
    <linearGradient id="cursorB" x1="48" y1="30" x2="48" y2="66" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7ba0ff" />
      <stop offset="1" stop-color="#8b7cf6" />
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="80" height="80" rx="22" fill="url(#bgB)" />
  <!-- 左书页 -->
  <path d="M46 26 L38 36 L46 68 L44 36 Z" fill="#2a3140" />
  <!-- 右书页（倒V 右片） -->
